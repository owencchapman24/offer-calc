# Tests, the engine's formatting guard, the type check and the build, on every push and pull request.
# The PolicyEngine comparison (npm run oracle) stays manual: it needs Python and PolicyEngine and takes
# minutes.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
